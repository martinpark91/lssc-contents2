<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<style>

@font-face{font-family:"PV";font-weight:45 920;src:url("file:///private/tmp/claude-501/-Users-martinpark/44d52f04-5ad9-4ccd-9b3a-b2cbca02f3b7/scratchpad/font/PretendardVariable.woff2") format("woff2")}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:linear-gradient(160deg,#0b1a3f 0%,#1c3a82 55%,#0b1a3f 100%);color:#fff;font-family:"PV",sans-serif;position:relative}
.side{position:absolute;top:0;bottom:0;width:285px;background:rgba(5,12,32,.72);display:flex;align-items:center;justify-content:center}
.side.l{left:0}.side.r{right:0}

.c{position:absolute;left:285px;width:630px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;padding:0 52px}
.team{font-size:29px;font-weight:800;letter-spacing:-1.2px;line-height:1.3}
.team b{color:#ff4d2e;font-weight:800;margin:0 4px}
.team .tb{display:inline-block;background:#39ff14;color:#0b1a3f;border-radius:999px;padding:1px 14px 3px;margin-left:4px}
.tc{display:flex;align-items:center;gap:12px;margin-top:26px;font-size:16px;font-weight:600}
.tc i{flex:1;height:5px;border-radius:9px;background:rgba(255,255,255,.18);position:relative}
.tc i::after{content:"";position:absolute;left:0;top:0;bottom:0;width:70%;border-radius:9px;background:#39ff14;box-shadow:0 0 10px rgba(57,255,20,.6)}
.big{font-size:112px;font-weight:900;line-height:1.08;letter-spacing:-7px;margin-top:20px}

  <div class="tc"><span>0:00</span><i></i><span>0:03</span></div>
  <p class="big">멈춰,<br><em>3초</em>면<br>충분해.</p>
</div>
