<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@700;900&family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500&display=block">
<style>
/* 슬랙은 가운데 정사각형(가로 285~915px)만 잘라 보여주므로 핵심 내용은 모두 가운데 630px 안에 배치 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#ffe14d;color:#111;font-family:'Noto Sans KR',sans-serif;position:relative}
.side{position:absolute;top:0;bottom:0;width:285px;background:#111}
.side.l{left:0}.side.r{right:0}
.side span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-90deg);white-space:nowrap;font-family:'Black Han Sans';font-size:44px;color:#ffe14d;letter-spacing:2px}
.side.r span{transform:translate(-50%,-50%) rotate(90deg)}
.center{position:absolute;left:285px;width:630px;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 30px}
.band{background:#111;color:#ffe14d;font-family:'Black Han Sans';font-size:40px;line-height:1.2;padding:10px 18px}
.band mark{background:#ff4d2e;color:#111;padding:0 8px}
.big{font-family:'Black Han Sans';font-size:108px;line-height:1;margin-top:22px;white-space:nowrap;letter-spacing:-2px}
.big em{font-style:normal;color:#ff4d2e}
.tc{display:flex;align-items:center;gap:10px;font:500 18px 'IBM Plex Mono',monospace;margin-top:28px;width:440px}
.tc i{flex:1;height:6px;background:rgba(17,17,17,.15);border-radius:3px;position:relative}
.tc i::after{content:"";position:absolute;inset:0;width:72%;background:#111;border-radius:3px}
</style></head><body>
<div class="side l"><span>LSSC®</span></div>
<div class="side r"><span>TEAM BUILDING</span></div>
<div class="center">
  <div class="band">콘텐츠 2본부 + 바이럴마케팅팀<br><mark>팀빌딩</mark></div>
  <p class="big">멈춰.<br><em>3초</em>면<br>충분해.</p>
  <div class="tc"><span>0:00</span><i></i><span>0:03</span></div>
</div>
</body></html>
