<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@700;900&family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500&display=block">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#ffe14d;color:#111;font-family:'Noto Sans KR',sans-serif;padding:56px 64px;position:relative}
.band{display:inline-flex;align-items:center;gap:14px;background:#111;color:#ffe14d;border-left:10px solid #ff4d2e;padding:12px 20px;font-family:'Black Han Sans';font-size:38px}
.band .x{color:#ff4d2e}.band mark{background:#ffe14d;color:#111;padding:0 10px}
.tc{display:flex;align-items:center;gap:12px;font:500 18px 'IBM Plex Mono',monospace;margin-top:30px;width:620px}
.tc i{flex:1;height:6px;background:rgba(17,17,17,.15);border-radius:3px;position:relative}
.tc i::after{content:"";position:absolute;inset:0;width:72%;background:#111;border-radius:3px}
.big{font-family:'Black Han Sans';font-size:150px;line-height:.95;margin-top:18px;letter-spacing:-2px}
.big em{font-style:normal;color:#ff4d2e}
.sub{position:absolute;left:64px;bottom:50px;font-family:'Black Han Sans';font-size:34px}
.logo{position:absolute;right:64px;bottom:50px;font-family:'Black Han Sans';font-size:40px}
.phone{position:absolute;right:80px;top:150px;width:200px;height:356px;border-radius:24px;background:#111;transform:rotate(6deg);display:grid;place-items:center;color:#fff;font-family:'Black Han Sans';font-size:44px;text-align:center;line-height:1.1;box-shadow:12px 12px 0 #ff4d2e}
.phone span{background:#ffe14d;color:#111;padding:0 6px}
</style></head><body>
<div class="band"><span>콘텐츠 2본부</span><span class="x">+</span><span>바이럴마케팅팀</span><mark>팀빌딩</mark></div>
<div class="tc"><span>0:00</span><i></i><span>0:03</span></div>
<p class="big">멈춰. <em>3초</em>면<br>충분해.</p>
<div class="phone"><p>첫 3초<br><span>훅</span></p></div>
<p class="sub">스크롤을 멈추게 하라, 승부는 첫 3초.</p>
<p class="logo">LSSC®</p>
</body></html>
